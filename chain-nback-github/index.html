<style>
  html, body { margin: 0; min-height: 100%; background: #050403; }
  #chain { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  /* phones: no double-tap zoom or text selection on the answer buttons */
  .ch-ans, .ch-next, .cx-go, .ch-autobtn { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
</style>

<body>
<section id="chain" class="training chain"></section>
<script>
  // standalone: English only, no surrounding app
  window.LGApp = { lang: () => 'en', show: () => {}, goMenu: () => window.LGChain && window.LGChain.open(), standalone: true };
</script>
<script>window.LG_MUSIC_TRACKS = ['celtic'];   // site público: só a faixa livre de direitos</script>
<script src="chain.js?v=26"></script>
<script>
  window.LGChain.open();
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
